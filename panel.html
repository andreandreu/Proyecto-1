<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Panel de marcador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h1>MARCADOR PILOTA VALENCIANA</h1></header>
    <main>
        <section class="marcador"> <!-- MARCADOR -->
            <p id="jocs_rojos">20</p>
            <p id="punts_rojos">NET</p>
            <p id="punts_blaus">NET</p>
            <p id="jocs_blaus">20</p>
        </section>
        <section class="botones"><!-- VARIABLES PUNTOS -->
            <section class="roig"> <!-- PUNTUACIÓ EQUIP ROIG -->
                <p class="equip_roig">EQUIP ROIG</p>
                <div>
                    <p>PUNTS ROJOS</p> <!-- PUNTS ROJOS -->
                    <input type="button" id="suma_punt_roig" value="+">
                    <input type="button" id="resta_punt_roig" value="-">
                </div>
                <div><!-- JOCS ROJOS -->
                    <p class="equip.roig">JOCS ROJOS</p>    
                    <input type="button" id="suma_joc_roig" value="+">
                    <input type="button" id="resta_joc_roig" value="-">    
                </div>
            </section>
            <section class="blau"><!-- PUNTUACIO EQUIP BLAU -->
                <p class="equip_blau">EQUIP BLAU</p>
                <div><!-- PUNTS BLAUS -->
                    <P>PUNTS BLAUS</P>
                    <input type="button" id="suma_punt_blau" value="+">
                    <input type="button" id="resta_punt_blau" value="-">
                </div> 
                <div><!-- JOCS BLAUS -->
                    <P>JOCS BLAUS</P>
                    <input type="button" id="suma_joc_blau" value="+">
                    <input type="button" id="resta_joc_blau" value="-">
                </div>
            </section>
        </section>
        <section class="directo">
            <input type="button" class="boton_directo" id="directo_marcador" value="MARCADOR">
        </section>
        <section class="formularios"><!-- ROTULOS CAJA -->
            <form class="caja_estadistica"><!-- ROTULO NOM I CARREC -->
                    <p class="rotulo_formulario">NOM I CÀRREC</p>
                    <div>
                        <p id="nom_id">Nom</p>
                        <input id="nom_id">
                    </div>
                    <div>
                        <p id="carrec_id">Càrrec</p>
                        <input id="carrec_id">
                    </div>
                    <div class="contenedor_boton_dsk">
                        <input type="button" id="directo_nom_carrec" class="boton_directo" value="DSK1">
                    </div>
            </form>
            <form class="caja_estadistica"><!-- ESTADISTICA ROIG -->
                    <p class="rotulo_formulario">Estadistiques equip roig</p>
                    <input id="estadistica_equip_roig">
                    <div class="contenedor_boton_dsk">
                        <input type="button" id="estadistica_equip_roig" class="boton_directo" value="DSK2">
                    </div>
            </form>
            <form class="caja_estadistica"><!-- ESTADISTICA BLAU -->
                    <p class="rotulo_formulario">Estadistiques equip blau</p>
                    <p id="estadistica_equip_blau"></p>
                    <input id="estadistica_equip_blau">
                    <div class="contenedor_boton_dsk">
                        <input type="button" id="estadistica_equip_blau" class="boton_directo" value="DSK3">
                    </div>
            </form>
        </section>
        <section>
            <input type="button" id="vmix" class="boton_directo" value="CONECTADO">
        </section>
        <section>
            <input type="button" id="copy" class="boton_directo" value="COPY">
        </section>
    </main>
</body>
</html>
