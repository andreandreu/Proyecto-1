<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTFresta8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de marcador</title>
</head>
<body>
    <header><h1>MARCADOR PILOTA VALENCIANA</h1></header>
    <main>
        <section>
            <div>
                <p id="jocs_rojos">20</p>
            </div>
            <div>
                <p id="punts_rojos">NET</p>
            </div>
            <div>
                <p id="punts_blaus">NET</p>
            </div>
            <div>
                <p id="jocs_blaus">20</p>
            </div>
        </section>
        <section>
            <div>

            <div>
                <input type="button" id="resta_punt_roig" value="resta punt roig">

            <div>
                <input type="button" id="suma_punt_blau" value="suma punt blau">

                <input type="button" id="suma_joc_roig" value="suma joc roig">

            <div>
                <input type="button" id="resta_joc_roig" value="resta joc roig">

            <div>
                <input type="button" id="suma_joc_blau" value="suma joc blau">
            </div>
            <div>
                <input type="button" id="resta_joc_blau" value="resta joc blau">

        <section>
            <p><input type="button" id="live_marcador" value="en directo"></p>

</html>
